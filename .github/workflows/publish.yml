name: Publish to NPM

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine version and tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Tagged release
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/heads/main ]] || [[ $GITHUB_REF == refs/heads/master ]]; then
            # Main/master branch - stable release
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Update package version for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Ensure package is public for production releases
        run: |
          # Ensure production releases are public
          npm pkg set publishConfig.access=public
          echo "📦 Publishing public release to NPM"

      - name: Publish to NPM
        run: npm publish --provenance --tag ${{ steps.version.outputs.tag }}

      - name: Create GitHub release (for manual pushes to main/master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

