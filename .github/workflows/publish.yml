name: Publish Stable Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install trusted-publishing npm client
        run: npm install --global npm@12.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Validate release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require main branch ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Pack the inspected release
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_FILE="endevre-entry-on-kitchen-${VERSION}.tgz"
          npm pack --ignore-scripts
          test -f "$PACKAGE_FILE"
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish inspected release with npm trusted publishing
        run: npm publish "${{ steps.package.outputs.file }}" --tag latest --ignore-scripts
